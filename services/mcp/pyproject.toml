[project]
name = "talk-to-rag-audit-mcp"
version = "0.1.0"
description = "Read-only MCP server over the talk-to-rag audit schema"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
]

[project.scripts]
talk-to-rag-audit-mcp = "talk_to_rag_audit_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
