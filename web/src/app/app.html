<header>
  <span class="brand">Talk to RAG</span>
  @if (auth.signedIn()) {
    <nav>
      <a routerLink="/sources" routerLinkActive="current" ariaCurrentWhenActive="page">Sources</a>
      <a routerLink="/search" routerLinkActive="current" ariaCurrentWhenActive="page">Search</a>
      <a routerLink="/history" routerLinkActive="current" ariaCurrentWhenActive="page">History</a>
      <a routerLink="/review" routerLinkActive="current" ariaCurrentWhenActive="page">Review</a>
      <a
        routerLink=""
        routerLinkActive="current"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Concepts</a
      >
    </nav>
    @if (!auth.singleUser) {
      @if (auth.user(); as user) {
        <span class="user" [title]="user.email">{{ user.displayName || user.email }}</span>
      }
      <button type="button" (click)="auth.signOut()">Sign out</button>
    }
  }
</header>
<main>
  @if (auth.unreachable(); as unreachable) {
    <section role="alert">
      <h1>Can't reach the API</h1>
      <p>{{ unreachable.reason }}</p>
      <button type="button" (click)="retry(unreachable.url)">Try again</button>
    </section>
  } @else {
    <router-outlet />
  }
</main>
