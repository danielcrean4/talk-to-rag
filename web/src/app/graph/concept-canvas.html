<div class="graph" [style.width.px]="layout().width" [style.height.px]="layout().height">
  <svg [attr.width]="layout().width" [attr.height]="layout().height" aria-hidden="true">
    @for (item of layout().links; track item.link.conceptId + item.link.prerequisiteId) {
      <path
        [attr.d]="item.path"
        [class.proposed]="item.link.state === 'Proposed'"
        [class.active]="isLinkedToSelection(item.link.conceptId, item.link.prerequisiteId)"
      />
    }
  </svg>
  @for (node of layout().nodes; track node.concept.id) {
    <button
      type="button"
      class="node"
      [class.proposed]="node.concept.state === 'Proposed'"
      [class.selected]="node.concept.id === selectedId()"
      [style.left.px]="node.x"
      [style.top.px]="node.y"
      [style.width.px]="nodeWidth"
      [style.height.px]="nodeHeight"
      [attr.aria-pressed]="node.concept.id === selectedId()"
      (click)="pick.emit(node.concept)"
    >
      <span class="name">{{ node.concept.name }}</span>
      @if (node.concept.state === 'Proposed') {
        <span class="meta">suggested</span>
      } @else {
        <span class="meta">
          <span class="mastery" [attr.data-level]="node.concept.mastery.level">{{
            node.concept.mastery.level
          }}</span>
          @if (node.concept.passageCount) {
            · {{ node.concept.passageCount }} linked
          }
          @if (due().get(node.concept.id)?.due; as due) {
            · <span class="due">{{ due }} due</span>
          }
        </span>
      }
    </button>
  }
</div>
<p class="hint">Foundations sit at the bottom; each concept builds on the ones below it.</p>
