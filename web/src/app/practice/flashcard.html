<div class="card">
  <p class="progress quiet">
    {{ progress() }}
    @if (concept(); as concept) {
      · {{ concept }}
    }
  </p>
  <p class="prompt">{{ card().prompt }}</p>
  @if (revealed()) {
    <p class="answer">{{ card().answer }}</p>
    @if (cardSource(card()); as from) {
      <p class="quiet">
        From {{ from }}
        @if (card().sourceId; as sourceId) {
          · <a [href]="fileUrl(sourceId, card())" target="_blank" rel="noopener">Open</a>
        }
      </p>
    }
    <div class="row marks" role="group" aria-label="How did you do?">
      @for (mark of marks; track mark.score) {
        <button type="button" (click)="rated.emit(mark.score)" [disabled]="busy()">
          {{ mark.label }}
        </button>
      }
    </div>
  } @else {
    <div class="row">
      <button class="primary" type="button" (click)="revealed.set(true)">Show answer</button>
    </div>
  }
</div>
