name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    # The audit server's database tests read the audit schema and log in as the auditor role,
    # both made by the API's migrations. They fail instead of skipping when CI is set.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: talk_to_rag
          POSTGRES_PASSWORD: talk_to_rag
          POSTGRES_DB: talk_to_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talk_to_rag -d talk_to_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      # `make migrate` gives the auditor role this password and the audit server's tests log in with it.
      - name: Make an auditor password
        run: echo "TALK_TO_RAG_AUDITOR_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Apply the API's migrations to Postgres
        env:
          ConnectionStrings__TalkToRag: Host=127.0.0.1;Port=5432;Database=talk_to_rag;Username=talk_to_rag;Password=talk_to_rag
        run: make migrate

      # Python tests use the fake model adapters; the .NET integration tests start
      # pgvector with Testcontainers on the runner's Docker. No Ollama needed.
      - run: make test

      - name: Lint and format check for the Python services
        run: |
          uvx ruff@0.17.5 check services/ai services/mcp
          uvx ruff@0.17.5 format --check services/ai services/mcp

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true

      # The stack expects Ollama on the host. On a runner it is a container that publishes
      # the same port; only the embedding model is needed, since the run does no query rewriting.
      - name: Start Ollama with the embedding model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama
          until docker exec ollama ollama list >/dev/null 2>&1; do sleep 1; done
          docker exec ollama ollama pull nomic-embed-text

      # Scores retrieval on the sample documents and fails under evaluation/minimum_scores.json.
      - run: make eval

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make test-web

      - run: cd web && npm run format:check

      - name: Start Ollama with the embedding model
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama
          until docker exec ollama ollama list >/dev/null 2>&1; do sleep 1; done
          docker exec ollama ollama pull nomic-embed-text

      - name: Install the browser and its system libraries
        run: cd web && npm ci && npx playwright install --with-deps chromium

      # Builds the API image, which contains the production build of the Angular app, and
      # uploads, searches, re-processes and deletes a source through the app it serves.
      - run: make test-e2e
