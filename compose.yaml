# Local stack: Postgres + the Python AI service + the .NET API.
# Ollama runs natively on the Mac (Docker on macOS has no GPU access); containers reach it
# at host.docker.internal. Ports are published on 127.0.0.1 only, never the network.

name: talk-to-rag

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: talk_to_rag
      POSTGRES_PASSWORD: talk_to_rag
      POSTGRES_DB: talk_to_rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "talk_to_rag", "-d", "talk_to_rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai:
    build: services/ai
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      TALK_TO_RAG_BLOB_ROOT: /var/talk-to-rag/blobs
      TALK_TO_RAG_STT: faster-whisper
      TALK_TO_RAG_TTS: kokoro
      TALK_TO_RAG_MODEL_CACHE: /var/talk-to-rag/models
      HF_HOME: /var/talk-to-rag/models/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - blobs:/var/talk-to-rag/blobs
      - models:/var/talk-to-rag/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # The repo root, so the image can build the Angular app in web/ as well as the API.
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__TalkToRag: Host=postgres;Port=5432;Database=talk_to_rag;Username=talk_to_rag;Password=talk_to_rag
      # Create or update the schema when the API starts.
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-development-only-signing-key-not-a-secret}
      # No sign-in: everyone who can reach the API (this machine only) is the one local user.
      # Set TALK_TO_RAG_SINGLE_USER=false to use accounts with passwords.
      Auth__SingleUser: ${TALK_TO_RAG_SINGLE_USER:-true}
      AiService__BaseUrl: http://ai:8000
      BlobStorage__Root: /var/talk-to-rag/blobs
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - blobs:/var/talk-to-rag/blobs
    # The aspnet image has no curl or wget, so speak HTTP over bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  # Uploaded sources and audio, shared by key between the API and the AI service.
  blobs:
  # Downloaded speech models (Whisper, Kokoro), so a rebuilt image doesn't fetch them again.
  models:
