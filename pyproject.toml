[project]
name = "talk-to-rag"
version = "0.1.0"
description = "Voice-enabled RAG search over your own documents, with page citations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openai>=1.40"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
